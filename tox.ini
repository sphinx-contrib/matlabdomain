[tox]
requires =
    tox>=4
envlist = py{311,312,313,314}-sphinx{min,latest}, py312-sphinx82, py314-sphinxdev

[global_var]
passenv =
    USERNAME
    # Pass user color preferences through
    PY_COLORS
    FORCE_COLOR
    NO_COLOR
    CLICOLOR
    CLICOLOR_FORCE

[testenv]
passenv =
    {[global_var]passenv}
    COVERAGE_FILE
deps =
    pytest
    pytest-cov
    pytest-randomly
    defusedxml
    # tests/test_documentation.py builds docs/
    furo
    sphinxcontrib-mermaid
    # Sidecar docs in Markdown: the latest, and 4.0 with the oldest
    # Sphinx. Its caps may exclude Sphinx master, which then skips those tests.
    !sphinxdev: myst-parser
    sphinxmin: myst-parser==4.0.*
    # Oldest supported: the lower bounds in pyproject.toml.
    sphinxmin: Sphinx==8.0.*
    sphinxmin: tree-sitter==0.26.0
    sphinxmin: tree-sitter-matlab==1.3.0
    sphinx82: Sphinx==8.2.*
    sphinxlatest: Sphinx
    sphinxdev: https://github.com/sphinx-doc/sphinx/archive/refs/heads/master.zip
commands =
    pytest --cov --cov-report=term-missing --cov-report=html {posargs}
    sphinx-build -b html -d {envtmpdir}/doctrees tests/test_docs {envtmpdir}/html
