[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools_scm"]

[project]
authors = [
    { name = "Jørgen Cederberg", email = "jorgen@cederberg.be" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Documentation",
    "Topic :: Utilities",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Domain"
]
dependencies = [
    "Sphinx>=8.0.0",
    # tree-sitter and tree-sitter-matlab do NOT follow SemVer: both ship breaking
    # changes (grammar/AST shape, Python binding API) WITHOUT a major-version bump.
    # e.g. tree-sitter-matlab 1.3.0 was a BREAKING `fix!` released as a minor bump.
    # Pin upper bounds and evaluate EACH new release from its changelog/commits --
    # never trust the version number alone.
    "tree-sitter-matlab>=1.3.0,<=1.3.1",
    "tree-sitter>=0.26.0,<=0.26.0"
]
description = 'Sphinx "matlabdomain" extension'
dynamic = ["version"]
license = "BSD-2-Clause"
name = "sphinxcontrib-matlabdomain"
readme = "README.rst"
requires-python = ">=3.11.0"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ruff==0.17.3",
    "pyright==1.1.414",
    "tox>=4.60",
    "defusedxml>=0.7.1",
    "sphinx-autobuild"
]
markdown = [
    # Sidecar docs in Markdown (plan.md Section 2.11). The renderer
    # subclasses myst-parser's SphinxRenderer: test each release before
    # moving the cap.
    "myst-parser>=4,<6"
]
rtd = [
    "furo",
    "sphinxcontrib-mermaid"
]

[project.scripts]
sphinx-matlab-apidoc = "sphinxcontrib.matlab_apidoc:main"
sphinx-matlab-quickstart = "sphinxcontrib.matlab_quickstart:main"

[project.urls]
Download = "http://pypi.python.org/pypi/sphinxcontrib-matlabdomain"
Homepage = "https://github.com/sphinx-contrib/matlabdomain"

[tool.codespell]
builtin = "clear,rare"
ignore-words = ".github/codespell_ignore_words.txt"
skip = "./.git"

[tool.coverage.paths]
# tox measures the installed package; map it back to the checkout.
source = [
    "sphinxcontrib/",
    "*/site-packages/sphinxcontrib/"
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:"
]

[tool.coverage.run]
branch = true
omit = [
    '*/_build/*'
]
relative_files = true
# Not "sphinxcontrib": other distributions share that namespace package.
source_pkgs = [
    "sphinxcontrib.mat_api_check",
    "sphinxcontrib.mat_classify",
    "sphinxcontrib.mat_directives",
    "sphinxcontrib.mat_documenters",
    "sphinxcontrib.mat_handlers",
    "sphinxcontrib.mat_naming",
    "sphinxcontrib.mat_sidecars",
    "sphinxcontrib.mat_tree_sitter_parser",
    "sphinxcontrib.mat_types",
    "sphinxcontrib.matlab",
    "sphinxcontrib.matlab_apidoc",
    "sphinxcontrib.matlab_quickstart"
]

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/_build",
    "**/.venv",
    "**/build",
    "tests/roots",
    "tests/test_data",
    "tests/test_docs",
    "tests/quickstart_golden",
    "test_slow/gauntlet/repos",
    "test_slow/gauntlet/runs"
]
include = ["sphinxcontrib", "tests", "docs", "examples", "skills", "test_slow"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --show-capture=all --showlocals -s -vv"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
log_cli_level = "INFO"
minversion = "6.0"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
extend-exclude = [
    "tests/roots",
    "tests/test_data",
    "tests/test_docs",
    "tests/quickstart_golden",
    "test_slow/gauntlet/repos",
    "test_slow/gauntlet/runs"
]
force-exclude = true
indent-width = 4
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D415",
    "PLR2004",
    "RUF001",
    "RUF012",
    "SIM102"
]
# List of all the ruff rules (includes why the rule matters)
# https://docs.astral.sh/ruff/rules/
select = [
    "ARG",
    "B",
    "C",
    "C4",
    "C90",
    "D",
    "E",
    "ERA",
    "F",
    "FLY",
    "FURB",
    "I",
    "PERF",
    "PLR",
    "RUF",
    "SIM",
    "UP",
    "W"
]

[tool.ruff.lint.mccabe]
max-complexity = 51

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG001", "ARG002", "D104", "E203"]
"tests/test_autodoc.py" = ["E501"]
"tests/test_mat_types.py" = ["E501"]

[tool.ruff.lint.pylint]
# https://docs.astral.sh/ruff/settings/#lint_pylint_max-args
max-args = 7
# https://docs.astral.sh/ruff/settings/#lint_pylint_max-branches
max-branches = 30
# https://docs.astral.sh/ruff/settings/#lint_pylint_max-returns
max-returns = 20
# https://docs.astral.sh/ruff/settings/#lint_pylint_max-statements
max-statements = 100

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"sphinxcontrib.matlab_apidoc" = ["templates/*.jinja"]
"sphinxcontrib.matlab_quickstart" = ["templates/*.jinja"]

[tool.setuptools.packages.find]
include = ["sphinxcontrib*"]

[tool.setuptools_scm]

[tool.tox]
env_list = [
    "py311-sphinxmin",
    "py311-sphinxlatest",
    "py312-sphinxmin",
    "py312-sphinxlatest",
    "py313-sphinxmin",
    "py313-sphinxlatest",
    "py314-sphinxmin",
    "py314-sphinxlatest",
    "py312-sphinx82",
    "py314-sphinxdev"
]
requires = ["tox>=4.60"]

[tool.tox.env.lint]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
    ["pyright", "--pythonpath", "{env_python}", "--pythonplatform", "Linux"],
    ["pyright", "--pythonpath", "{env_python}", "--pythonplatform", "Windows"],
    ["pyright", "--pythonpath", "{env_python}", "--pythonplatform", "Darwin"]
]
deps = []
description = "Lint, format-check, and basic-type-check maintained Python"
extras = ["dev", "rtd", "markdown"]

[tool.tox.env_run_base]
commands = [
    ["pytest", "--cov", "--cov-report=term-missing", "--cov-report=html", { replace = "posargs", extend = true }],
    ["sphinx-build", "-b", "html", "-d", "{env_tmp_dir}/doctrees", "tests/test_docs", "{env_tmp_dir}/html"]
]
deps = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "defusedxml",
    "furo",
    "sphinxcontrib-mermaid",
    { replace = "if", condition = "not factor.sphinxdev", then = ["myst-parser"], else = [], extend = true },
    { replace = "if", condition = "factor.sphinxmin", then = ["myst-parser==4.0.*", "Sphinx==8.0.*", "tree-sitter==0.26.0", "tree-sitter-matlab==1.3.0"], else = [], extend = true },
    { replace = "if", condition = "factor.sphinx82", then = ["Sphinx==8.2.*"], else = [], extend = true },
    { replace = "if", condition = "factor.sphinxlatest", then = ["Sphinx"], else = [], extend = true },
    { replace = "if", condition = "factor.sphinxdev", then = ["https://github.com/sphinx-doc/sphinx/archive/refs/heads/master.zip"], else = [], extend = true }
]
pass_env = [
    "USERNAME",
    "PY_COLORS",
    "FORCE_COLOR",
    "NO_COLOR",
    "CLICOLOR",
    "CLICOLOR_FORCE",
    "COVERAGE_FILE"
]

[[tool.uv.index]]
default = true
url = "https://pypi.org/simple"
