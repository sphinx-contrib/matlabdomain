# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test and publish Python 🐍 package 📦

# Disabling all triggers accepted workflow_dispatch for now.
on:
  # push:
  # pull_request:
  workflow_dispatch:
  # schedule:
  #   # Run on Mondays at 06:00 UTC
  #   - cron:  '0 6 * * 1'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Force to use color
env:
    FORCE_COLOR: true

jobs:

  static-checks:
    name: Lint and basic typing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --locked --all-extras
    - run: uv run --locked tox -e lint

  test-sphinx:

    name: Run tests on ${{ matrix.os }} for Python ${{ matrix.python-version }}, Sphinx ${{ matrix.sphinx-version }}

    timeout-minutes: 15

    runs-on: ${{ matrix.os }}

    # Sphinx master may break at any time; it must not block.
    continue-on-error: ${{ matrix.sphinx-version == 'dev' }}

    env:
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.sphinx-version }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        sphinx-version: ["latest"]
        include:
        -   description: oldest supported dependencies on oldest supported python
            os: ubuntu-latest
            python-version: '3.11'
            sphinx-version: min
        -   description: last Sphinx 8 release line
            os: ubuntu-latest
            python-version: '3.12'
            sphinx-version: '82'
        -   description: sphinx dev with latest python
            # dev does not work with python <= 3.11 so only test with latest python
            os: ubuntu-latest
            python-version: '3.14'
            sphinx-version: dev

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7

    - name: Install tox
      run: uv tool install 'tox>=4.60' --with=tox-uv

    - name: Run with Tox
      run: tox -e "${{matrix.python-version}}-sphinx${{matrix.sphinx-version}}"

    - name: Upload html coverage
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}_${{ matrix.python-version }}_${{matrix.sphinx-version}}_htmlcov
        path: htmlcov

    - name: Upload coverage data
      if: (success() || failure()) && matrix.sphinx-version != 'dev'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.sphinx-version }}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

  coverage:
    name: Combine coverage of all test jobs
    needs: test-sphinx
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7

    - uses: actions/download-artifact@v8
      with:
        pattern: coverage-data-*
        merge-multiple: true

    - name: Combine and check coverage
      run: |
        uvx coverage combine
        uvx coverage html
        uvx coverage report --show-missing --skip-covered --fail-under=100

    - name: Upload combined html coverage
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: combined_htmlcov
        path: htmlcov

  build-n-publish:
    if: startsWith(github.ref, 'refs/tags') && github.repository == 'sphinx-contrib/matlabdomain'
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # setuptools_scm derives the version from git
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
    - name: Build a wheel and source distribution
      run: uv build
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
