# The real-project gauntlet's projects. fetch.py checks each one out into
# ../repos/<name>; gauntlet.py builds the enabled ones. In [projects.<name>],
# <name> is the checkout folder (letters, digits, - and _). Keys:
# url: the Git remote (required).
# commit: a SHA (best in full) or a tag. Without it, the default branch HEAD
# at the first fetch, kept in projects.lock.toml until fetch.py --update.
# root: the project root inside the checkout (default: the whole checkout).
# submodules: true fetches the submodules too (default false).
# enabled: false keeps the entry but skips the project (default true).
# parallel_may_differ: true when a serial vs -j difference is not a problem.
#
# The pins: the default branch HEADs on 2026-10-30; the projects added
# before that date kept their earlier pins.

